# Netlify config for the frontend.
#
# The app itself needs no changes to run here: every API call in src/api.ts is a
# relative path ("/api/..."), so the rewrites below are the whole integration.
#
# The backend lives on Render. If its URL ever changes, update it in the two
# redirect rules below.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so Netlify doesn't pick a version vite dislikes.
  NODE_VERSION = "22"

# Netlify doesn't know the .webmanifest extension and serves it as
# application/octet-stream. Say what it is.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# --- API proxy -------------------------------------------------------------
#
# status = 200 makes these REWRITES, not redirects: Netlify fetches the backend
# server-side and returns the response as its own. The browser therefore sees a
# single origin.
#
# That matters enormously for login. If the frontend called the backend directly
# it would be a cross-site request, the SameSite=Lax session cookie would stop
# being sent, and switching to SameSite=None would make it a third-party cookie
# that Safari blocks by default -- breaking sign-in on exactly the phone this app
# is for. Proxying avoids all of it, and means the backend needs no CORS config.

[[redirects]]
  from = "/api/*"
  to = "https://groceries-omeh.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/photos/*"
  to = "https://groceries-omeh.onrender.com/photos/:splat"
  status = 200
  force = true

# --- SPA fallback ----------------------------------------------------------
#
# MUST stay last. Netlify applies the first matching rule, so a catch-all placed
# above would swallow /api and /photos and serve them index.html instead.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
